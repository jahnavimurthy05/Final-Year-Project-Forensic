<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" fill="none">
  <!-- Standalone Mark (Scale & Positioned Left) -->
  <g transform="translate(20, 10) scale(0.43)">
    <!-- Subtle Forensic Ticks -->
    <g opacity="0.25" stroke="#14B8A6" stroke-width="2">
      <line x1="30" y1="256" x2="60" y2="256" />
      <line x1="452" y1="256" x2="482" y2="256" />
      <line x1="256" y1="30" x2="256" y2="60" />
      <line x1="256" y1="452" x2="256" y2="482" />
    </g>

    <!-- Base-Pair Rungs -->
    <g stroke="#14B8A6" stroke-width="3" stroke-linecap="round" opacity="0.5">
      <line x1="190" y1="140" x2="275" y2="140" stroke-dasharray="2 6" />
      <line x1="172" y1="196" x2="310" y2="196" />
      <line x1="168" y1="256" x2="336" y2="256" />
      <line x1="176" y1="316" x2="312" y2="316" />
      <line x1="198" y1="372" x2="265" y2="372" stroke-dasharray="2 6" />
    </g>

    <!-- Left Strand: Neural / Cranial Spine -->
    <path
      d="M 230 92 C 170 120, 150 180, 168 230 C 185 275, 235 300, 215 360 C 200 400, 175 410, 155 420"
      stroke="#A8A8A8"
      stroke-width="14"
      stroke-linecap="round"
    />

    <!-- Right Strand: Facial Silhouette -->
    <path
      d="M 240 96 C 285 106, 305 130, 305 160 C 305 185, 290 200, 310 215 L 345 250 L 315 272 C 328 286, 326 298, 312 308 C 316 322, 312 344, 280 366 C 255 385, 215 408, 185 416"
      stroke="#FFFFFF"
      stroke-width="15"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Landmark Nodes -->
    <circle cx="288" cy="140" r="9" fill="#14B8A6" />
    <circle cx="288" cy="140" r="18" stroke="#14B8A6" stroke-width="2" opacity="0.35" />
    <circle cx="270" cy="196" r="8" fill="#14B8A6" />
    <circle cx="345" cy="250" r="10" fill="#14B8A6" />
    <circle cx="345" cy="250" r="20" stroke="#14B8A6" stroke-width="2.5" opacity="0.5" />
    <circle cx="314" cy="308" r="8" fill="#14B8A6" />
    <circle cx="280" cy="366" r="9" fill="#14B8A6" />
    <circle cx="172" cy="196" r="6" fill="#FFFFFF" />
    <circle cx="168" cy="256" r="7" fill="#14B8A6" />
    <circle cx="176" cy="316" r="6" fill="#FFFFFF" />
  </g>

  <!-- Vertical Divider Line -->
  <line x1="260" y1="65" x2="260" y2="175" stroke="#333333" stroke-width="1.5" />

  <!-- Typography: Modern Geometric Brand Wordmark -->
  <g font-family="system-ui, -apple-system, 'Inter', 'Segoe UI', sans-serif">
    <!-- Brand Primary Title -->
    <text x="290" y="118" font-size="44" font-weight="800" fill="#FFFFFF" letter-spacing="3.5">
      PHENOFACE<tspan fill="#14B8A6">.</tspan><tspan fill="#14B8A6" font-weight="400">AI</tspan>
    </text>

    <!-- Subtitle / Platform Definition -->
    <text x="292" y="154" font-size="14" font-weight="600" fill="#A8A8A8" letter-spacing="4.5">
      FORENSIC GENOMICS &amp; RECONSTRUCTION
    </text>

    <!-- System Badge / Coordinates -->
    <g transform="translate(292, 172)">
      <rect width="180" height="22" rx="4" fill="#151515" stroke="#262626" stroke-width="1" />
      <circle cx="12" cy="11" r="3.5" fill="#14B8A6" />
      <text x="24" y="15" font-size="10" font-weight="700" fill="#14B8A6" font-family="'JetBrains Mono', monospace" letter-spacing="1.5">
        HIRISPLEX-S // CV
      </text>
    </g>
