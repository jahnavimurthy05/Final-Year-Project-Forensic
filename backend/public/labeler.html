<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gallery Sex Labeler — Forensic Tool</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0d1117;
      color: #e6edf3;
      font-family: 'Segoe UI', sans-serif;
      padding: 24px;
    }
    h1 {
      text-align: center;
      font-size: 1.6rem;
      margin-bottom: 6px;
      color: #00d2ff;
      text-shadow: 0 0 12px #00d2ff88;
    }
    #summary {
      text-align: center;
      font-size: 0.85rem;
      color: #8b949e;
      margin-bottom: 20px;
    }
    #progress-bar-wrap {
      width: 60%;
      margin: 0 auto 24px;
      background: #21262d;
      border-radius: 8px;
      height: 10px;
      overflow: hidden;
    }
    #progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #00d2ff, #7b2ff7);
      border-radius: 8px;
      transition: width 0.3s ease;
    }
    #controls {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    button {
      padding: 8px 18px;
      border-radius: 8px;
      border: none;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.85rem;
      transition: all 0.15s;
    }
    .btn-export {
      background: #21262d;
      color: #58a6ff;
      border: 1px solid #30363d;
    }
    .btn-export:hover { border-color: #58a6ff; }
    #grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 16px;
      max-width: 1400px;
      margin: 0 auto;
    }
    .card {
      background: #161b22;
      border: 2px solid #30363d;
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: border-color 0.2s;
    }
    .card.labeled-male  { border-color: #2563eb; }
    .card.labeled-female { border-color: #db2777; }
    .card img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      display: block;
    }
    .card-body {
      padding: 10px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .card-filename {
      font-size: 0.7rem;
      color: #8b949e;
      text-align: center;
    }
    .card-btns {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }
    .btn-male, .btn-female {
      padding: 7px 4px;
      border-radius: 6px;
      border: 2px solid transparent;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn-male {
      background: #0d1117;
      color: #6ea8fe;
      border-color: #2563eb44;
    }
    .btn-male:hover, .btn-male.active {
      background: #1d3a6e;
      color: #fff;
      border-color: #2563eb;
      box-shadow: 0 0 8px #2563eb88;
    }
    .btn-female {
      background: #0d1117;
      color: #f9a8d4;
      border-color: #db277744;
    }
    .btn-female:hover, .btn-female.active {
      background: #5c1235;
      color: #fff;
      border-color: #db2777;
      box-shadow: 0 0 8px #db277788;
    }
    .badge {
      text-align: center;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 2px 0;
      border-radius: 4px;
    }
    .badge-male   { color: #60a5fa; }
    .badge-female { color: #f472b6; }
    .badge-unknown { color: #6b7280; }
    #toast {
      position: fixed;
      bottom: 30px;
      right: 30px;
      background: #1f6feb;
      color: #fff;
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
    }
    #toast.show { opacity: 1; }
    #filter-btns {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 16px;
    }
    .filter-btn {
      padding: 5px 14px;
      border-radius: 20px;
      border: 1px solid #30363d;
      background: #161b22;
      color: #8b949e;
      font-size: 0.8rem;
      cursor: pointer;
    }
    .filter-btn.active { border-color: #00d2ff; color: #00d2ff; }
  </style>
</head>
<body>
  <h1>🔬 Gallery Sex Labeler</h1>
  <div id="summary">Loading images…</div>
  <div id="progress-bar-wrap"><div id="progress-bar" style="width:0%"></div></div>

  <div id="controls">
    <button class="btn-export" onclick="exportMetadata()">⬇ Download metadata.json</button>
    <button class="btn-export" onclick="labelAll('male')">♂ Set ALL to Male</button>
    <button class="btn-export" onclick="labelAll('female')">♀ Set ALL to Female</button>
  </div>

  <div id="filter-btns">
    <button class="filter-btn active" onclick="setFilter('all', this)">All</button>
    <button class="filter-btn" onclick="setFilter('male', this)">♂ Male</button>
    <button class="filter-btn" onclick="setFilter('female', this)">♀ Female</button>
    <button class="filter-btn" onclick="setFilter('unknown', this)">❓ Unlabeled</button>
  </div>

  <div id="grid"></div>
  <div id="toast"></div>

  <script>
    const API = 'http://localhost:5000/api/labeler';
    let allImages = [];
    let currentFilter = 'all';

    async function load() {
      const res = await fetch(`${API}/images`);
      allImages = await res.json();
      renderGrid();
      updateSummary();
    }

    function setFilter(f, btn) {
      currentFilter = f;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderGrid();
    }

    function renderGrid() {
      const grid = document.getElementById('grid');
      grid.innerHTML = '';
      const visible = allImages.filter(img => {
        if (currentFilter === 'all') return true;
        if (currentFilter === 'unknown') return !img.sex || img.sex === 'unknown';
        return img.sex === currentFilter;
      });

      visible.forEach(img => {
        const card = document.createElement('div');
        card.className = `card labeled-${img.sex}`;
        card.id = `card-${img.file}`;

        const badgeClass = img.sex === 'male' ? 'badge-male' : img.sex === 'female' ? 'badge-female' : 'badge-unknown';
        const badgeText = img.sex === 'male' ? '♂ Male' : img.sex === 'female' ? '♀ Female' : '❓ Unknown';

        card.innerHTML = `
          <img src="${img.dataUrl}" alt="${img.file}" loading="lazy" />
          <div class="card-body">
            <div class="card-filename">${img.file}</div>
            <div class="badge ${badgeClass}">${badgeText}</div>
            <div class="card-btns">
              <button class="btn-male ${img.sex === 'male' ? 'active' : ''}"
                      onclick="label('${img.file}', 'male')">♂ Male</button>
              <button class="btn-female ${img.sex === 'female' ? 'active' : ''}"
                      onclick="label('${img.file}', 'female')">♀ Female</button>
            </div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    async function label(file, sex) {
      const res = await fetch(`${API}/label`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ file, sex }),
      });
      if (!res.ok) { showToast('❌ Error saving!'); return; }

      // Update in-memory list
      const img = allImages.find(i => i.file === file);
      if (img) img.sex = sex;

      // Update card in DOM
      const card = document.getElementById(`card-${file}`);
      if (card) {
        card.className = `card labeled-${sex}`;
        const badgeClass = sex === 'male' ? 'badge-male' : 'badge-female';
        const badgeText = sex === 'male' ? '♂ Male' : '♀ Female';
        card.querySelector('.badge').className = `badge ${badgeClass}`;
        card.querySelector('.badge').textContent = badgeText;
        card.querySelectorAll('.btn-male, .btn-female').forEach(b => b.classList.remove('active'));
        card.querySelector(sex === 'male' ? '.btn-male' : '.btn-female').classList.add('active');
      }

      updateSummary();
      showToast(`✅ ${file} → ${sex}`);
    }

    async function labelAll(sex) {
      if (!confirm(`Set ALL visible images to ${sex}?`)) return;
      const visible = allImages.filter(img => {
        if (currentFilter === 'all') return true;
        if (currentFilter === 'unknown') return !img.sex || img.sex === 'unknown';
        return img.sex === currentFilter;
      });
      for (const img of visible) {
        await label(img.file, sex);
      }
    }

    function updateSummary() {
      const males = allImages.filter(i => i.sex === 'male').length;
      const females = allImages.filter(i => i.sex === 'female').length;
      const total = allImages.length;
      document.getElementById('summary').textContent =
        `Total: ${total}  |  ♂ Male: ${males}  |  ♀ Female: ${females}`;
      const pct = ((males + females) / total) * 100;
      document.getElementById('progress-bar').style.width = pct + '%';
    }

    async function exportMetadata() {
      window.open(`${API}/export`, '_blank');
    }

    let toastTimer;
    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => t.classList.remove('show'), 2000);
    }

    load();
  </script>
</body>
</html>
